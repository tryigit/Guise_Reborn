name: Build signed release APK

on:
  push:
    branches: [build/release-b68d4dd]

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail
          PASS="guise-personal-$(date +%s)-${RANDOM}"
          keytool -genkeypair -noprompt \
            -keystore /tmp/guise-personal.jks \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias guise-personal \
            -keyalg RSA \
            -keysize 4096 \
            -validity 3650 \
            -dname "CN=Guise Personal Build,O=Personal"

          UNSIGNED="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$UNSIGNED"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" /tmp/Guise-Reborn-b68d4dd-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/guise-personal.jks \
            --ks-key-alias guise-personal \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --out /tmp/Guise-Reborn-b68d4dd-release.apk \
            /tmp/Guise-Reborn-b68d4dd-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs /tmp/Guise-Reborn-b68d4dd-release.apk
          unzip -l /tmp/Guise-Reborn-b68d4dd-release.apk | grep -E 'lib/arm64-v8a/libguise_vulkan.so|META-INF/xposed/native_init.list'
          sha256sum /tmp/Guise-Reborn-b68d4dd-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Guise-Reborn-release-b68d4dd
          path: /tmp/Guise-Reborn-b68d4dd-release.apk
          if-no-files-found: error
          retention-days: 1

name: Agent verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/refactor-network-and-batch-logs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and debug builds
        run: |
          chmod +x gradlew
          ./gradlew \
            :ktx-xposed:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :guise-test:assembleDebug \
            --stacktrace

name: Export source snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Archive source
        run: zip -qr source-snapshot.zip . -x '.git/*'
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.zip
          if-no-files-found: error
          retention-days: 1
